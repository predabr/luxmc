    <text x="52" y="140" fill="rgb(239,244,255)" font-size="62" font-weight="750" letter-spacing="-3">Seu Minecraft.</text>
    <text x="52" y="207" fill="url(#accent)" font-size="62" font-weight="750" letter-spacing="-3">Do seu jeito.</text>
    <text x="56" y="256" fill="rgb(169,184,205)" font-size="18">Instâncias, modpacks e sua turma no mesmo lugar.</text>
    <g fill="rgb(169,184,205)" font-size="12" letter-spacing="2">
      <text x="56" y="316">RUST + TAURI</text><text x="244" y="316">WINDOWS + LINUX</text>
    </g>
  </g>
  <g transform="translate(845 58)">
    <path d="M0 38 66 0 132 38 66 76Z" fill="url(#accent)"/>
    <path d="M0 38 66 76 66 152 0 114Z" fill="rgb(44,94,199)"/>
