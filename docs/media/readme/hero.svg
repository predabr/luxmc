<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Luxmc 4.0 — Seu Minecraft, do seu jeito</title>
  <desc id="description">Instâncias, modpacks, personalização e amigos em um launcher para desktop.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="rgb(12,17,27)"/><stop offset="1" stop-color="rgb(25,40,65)"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="rgb(160,204,255)"/><stop offset="1" stop-color="rgb(69,129,244)"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="rgb(69,129,244)" stop-opacity=".2"/><stop offset="1" stop-color="rgb(69,129,244)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#surface)"/>
  <circle cx="980" cy="160" r="280" fill="url(#glow)"/>
  <g fill="none" stroke="rgb(142,187,255)" stroke-opacity=".12">
