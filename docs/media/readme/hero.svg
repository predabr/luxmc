    <path d="M-64 144 2 106 68 144 2 182Z" fill="rgb(142,187,255)" fill-opacity=".3" stroke="rgb(142,187,255)" stroke-opacity=".5"/>
    <path d="M-64 144 2 182 2 258-64 220Z" fill="rgb(44,94,199)" fill-opacity=".25" stroke="rgb(142,187,255)" stroke-opacity=".35"/>
    <path d="M2 182 68 144 68 220 2 258Z" fill="rgb(69,129,244)" fill-opacity=".25" stroke="rgb(142,187,255)" stroke-opacity=".35"/>
    <path d="M92 152 158 114 224 152 158 190Z" fill="rgb(142,187,255)" fill-opacity=".15" stroke="rgb(142,187,255)" stroke-opacity=".4"/>
    <path d="M92 152 158 190 158 266 92 228Z" fill="rgb(44,94,199)" fill-opacity=".15" stroke="rgb(142,187,255)" stroke-opacity=".25"/>
    <path d="M158 190 224 152 224 228 158 266Z" fill="rgb(69,129,244)" fill-opacity=".15" stroke="rgb(142,187,255)" stroke-opacity=".25"/>
