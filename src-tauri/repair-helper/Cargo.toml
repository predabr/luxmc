[package]
name = "luxmc-repair"
version = "3.9.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
tauri-winres = "=0.3.6"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
