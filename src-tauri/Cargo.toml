[package]
name = "luxmc"
version = "1.7.1"
description = "Luxmc Minecraft Launcher."
authors = ["Luxmc contributors"]
edition = "2021"
license = "Proprietary"

[lib]
name = "luxmc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "migrate"] }
directories = "5"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
urlencoding = "2"
open = "5"
zip = "0.6"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
sysinfo = "0.39.6"
image = "0.25"
fastnbt = "2.6"
semver = "1.0"
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "6.1"
zip-extract = "0.1"
zstd = "0.13"
flate2 = "1.0"
tar = "0.4"
fs_extra = "1.3"
etcetera = "0.8"
governor = "0.7"
tower = "0.5"
url = "2.5"
which = "7.0"
rfd = "0.15"
regex = "1.11"
toml = "0.8"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
fastanvil = "0.32"
igd-next = "0.14"
cacache = { version = "13.1", default-features = false, features = ["tokio-runtime"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }
cgroups-rs = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
