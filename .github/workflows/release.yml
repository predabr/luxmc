name: Release AppImage & Linux Bundles

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Linux Packages (AppImage, Deb, RPM)
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux/Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri AppImage & Linux Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0-beta
          releaseName: 'Luxmc Launcher v1.0.0-BETA'
          releaseBody: |
            ## 🚀 Luxmc Launcher v1.0.0-BETA — Official Release
            
            ### ⚡ Desempenho & Aceleração de Hardware no Linux
            - **Fim do Lag no AppImage**: Habilitada aceleração total por hardware via DMA-BUF (Mesa/Vulkan/OpenGL), eliminando a rasterização por software (CPU) que travava a interface.
            - **Renderização Fluida**: Remoção de filtros pesados de desfoque global que sobrecarregavam a GPU a cada frame.
            
            ### 🎬 Nova Cutscene Cinematográfica
            - **Animação mais ágil (2.3s)**: Transição contínua sem congelamentos artificiais.
            - **Snap magnético e flash de iluminação** com efeito sonoro harmônico gerado via Web Audio API.
            - **Atalhos para pular**: Teclas Space, Enter, Esc ou clique em qualquer lugar da tela.
            
            ### 🎨 Redesign Visual Completo (Estilo Referência)
            - **Sidebar Lateral**: Item ativo em squircle com gradiente metálico e ícones minimalistas.
            - **Central de Mods & Recursos**: Integração nativa Modrinth + CurseForge com busca simultânea, filtros duplos, seletor de versões e instalação direta.
            - **Dashboard Inicial**: Nova saudação estilizada, atalhos rápidos de biblioteca, tabela de servidores ranqueados e estatísticas de tempo de jogo.
            - **Configurações do Sistema**: Novos switches de alternância estilizados (trilha champanhe com thumb escuro), abas com ícones e botão de salvar padronizado.
          releaseDraft: false
          prerelease: true
