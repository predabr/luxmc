name: Release AppImage & Linux Bundles

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Linux Packages (AppImage, Deb, RPM)
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux/Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri AppImage & Linux Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.6.0-beta
          releaseName: 'Luxmc Launcher v0.6.0-BETA'
          releaseBody: |
            ## 🚀 Luxmc Launcher v0.6.0-BETA — Official Release
            
            - ⚡ **Cutscene 360° Split & Snap**: Quadrantes girando por 2s, pausa dramática e reagrupamento limpo.
            - 🎵 **Áudio & Efeitos Visuais**: Efeito sonoro sintetizado em tempo real + partículas douradas no canvas.
            - 🎮 **Configurações da Instância (SKlauncher-style)**: Abas dedicadas (Geral, Instalação, Janela, Java/Vulkan, Hooks).
            - 👕 **Personalização 3D**: Ajuste volumétrico de skins, 3D capes (OptiFine/Migrator/Mojang) e busca NameMC.
            - 🐧 **Linux-first**: Suporte a Vulkan (Mesa Zink), ícone nativo corrigido e Discord Rich Presence.
          releaseDraft: false
          prerelease: true
