name: Release AppImage, Windows & Universal JAR

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Packages (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.2.0-alpha
          releaseName: 'Luxmc Launcher v1.2.0-ALPHA'
          releaseBody: |
            ## 🚀 Luxmc Launcher v1.2.0-ALPHA — Official Multiplatform Release
            
            Disponível agora para **Windows (.exe / .msi)**, **Linux (AppImage / .deb)** e **Universal Java (.jar)**!
            
            ### 🎮 Discord Rich Presence 2.0 Conectado
            - **No Launcher**: Exibe status do Luxmc Launcher e localização no app com ícone 3D oficial em alta resolução.
            - **Em Jogo**: Alterna automaticamente para o ID oficial do Minecraft, mostrando **Jogando Minecraft**, nome da instância, loader, versão ativa e tempo de sessão.
            
            ### ☕ Universal Java Bootstrap (Luxmc.jar)
            - Executável multiplataforma `java -jar Luxmc.jar` compatível com Java 11, 17, 21 e 25+.
            - Identificação automática do sistema operacional e do binário nativo local ou download direto das releases oficiais.
            
            ### 🪟 Binário Nativo Windows (Luxmc.exe)
            - Compilado nativamente em 64-bit com aceleração WebView2.
            
            ### ⚡ Desempenho & Aceleração de Hardware
            - Otimização de RAM em cache de skins, mods e instâncias.
            - Navegação fluida com estilo visual inspirado no SKlauncher e paleta Luxmc.
          releaseDraft: false
          prerelease: true

  build-jar:
    name: Build Universal Luxmc.jar
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: build-and-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Bootstrap JAR
        run: |
          mkdir -p out
          javac -source 11 -target 11 -d out bootstrap-jar/src/com/luxmc/bootstrap/Main.java
          cp src-tauri/icons/icon.png out/icon.png
          echo "Manifest-Version: 1.0" > manifest.txt
          echo "Main-Class: com.luxmc.bootstrap.Main" >> manifest.txt
          jar cfm Luxmc.jar manifest.txt -C out .

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.0-alpha
          files: Luxmc.jar
