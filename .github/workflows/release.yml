name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.0.0)"
        required: true
        default: "v3.0.0"
      reuse_assets:
        description: "Verify and publish an existing draft without rebuilding installers"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Get tag
        id: get-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          node --test tests/release-manifest.test.mjs

      - name: Create or Find GitHub Release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.get-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            let releaseId;
            const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error(`Release ${tag} is already published.`);
              releaseId = existing.id;
              console.log(`Reusing existing release for tag ${tag} (ID: ${releaseId})`);
            } else {
              const v = tag.replace(/^v/, "");
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Luxmc ${tag}`,
                body: require("fs").readFileSync(`docs/releases/${tag}.md`, "utf8"),
                draft: true,
                prerelease: tag.includes("beta") || tag.includes("alpha") || tag.includes("rc"),
              });
              releaseId = data.id;
              console.log(`Created new release for tag ${tag} (ID: ${releaseId})`);
            }
            return releaseId;

  build-linux:
    needs: create-release
    if: ${{ inputs.reuse_assets != true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Linux release
        run: |
          pnpm check
          python3 tests/installers.test.py
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri (Linux — DEB + RPM + AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage

      - name: Build and Upload Arch Linux Package (.pkg.tar.zst)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          sudo apt-get install -y zstd tar
          bash scripts/build-arch-package.sh
          PKG_FILE=$(ls packaging/arch/luxmc-*-1-x86_64.pkg.tar.zst 2>/dev/null | head -n 1)
          if [ -n "$PKG_FILE" ] && [ -f "$PKG_FILE" ]; then
            gh release upload "$RELEASE_TAG" "$PKG_FILE" --clobber
          fi

  build-windows:
    needs: create-release
    if: ${{ inputs.reuse_assets != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Windows release
        run: |
          pnpm check
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri (Windows — NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Publish Windows installer with unchanged filename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows installer was not built.' }
          Copy-Item -LiteralPath $installer.FullName -Destination 'Lux MC Launcher.exe' -Force
          gh release upload $env:RELEASE_TAG 'Lux MC Launcher.exe#Lux MC Launcher.exe' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer upload failed.' }

  build-macos:
    needs: create-release
    if: ${{ inputs.reuse_assets != true }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (macOS — DMG universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target universal-apple-darwin --bundles dmg

  verify-release-assets:
    needs: [create-release, build-linux, build-windows, build-macos]
    if: ${{ always() && needs.create-release.result == 'success' && (inputs.reuse_assets == true || (needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and verify every published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir artifacts
          cd artifacts
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY"
          expected=(
            "luxmc-${version}-1-x86_64.pkg.tar.zst"
            "Luxmc-${version}-1.x86_64.rpm"
            "Luxmc_${version}_amd64.AppImage"
            "Luxmc_${version}_amd64.deb"
            "Luxmc_${version}_universal.dmg"
            "Luxmc_${version}_x64-setup.exe"
            "Lux.MC.Launcher.exe"
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          gh api "repos/$REPOSITORY/releases/$RELEASE_ID" > release.json
          node ../scripts/build-release-manifest.mjs release.json .
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS latest.json --repo "$REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --latest
