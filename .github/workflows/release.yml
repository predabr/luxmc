name: Release Multiplatform (Linux, Windows, macOS & Universal JAR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Packages (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Luxmc Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Luxmc Launcher ${{ github.ref_name }} — Official Multiplatform Release
            
            Disponível para **Windows (.exe / .msi)**, **Linux (AppImage / .deb / .rpm)**, **macOS (.dmg / .app)** e **Universal Java (.jar)**!
          releaseDraft: false
          prerelease: false

  build-jar:
    name: Build Universal Luxmc.jar
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: build-and-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Bootstrap JAR
        run: |
          mkdir -p out
          javac -source 11 -target 11 -d out bootstrap-jar/src/com/luxmc/bootstrap/Main.java
          cp src-tauri/icons/icon.png out/icon.png
          echo "Manifest-Version: 1.0" > manifest.txt
          echo "Main-Class: com.luxmc.bootstrap.Main" >> manifest.txt
          jar cfm Luxmc.jar manifest.txt -C out .

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: Luxmc.jar
