name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get tag
        id: get-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Find GitHub Release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.get-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            let releaseId;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              releaseId = existing.data.id;
              console.log(`Reusing existing release for tag ${tag} (ID: ${releaseId})`);
            } catch (e) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Luxmc ${tag}`,
                body: [
                  "## 🚀 Luxmc " + tag + " — Lançamento Oficial",
                  "",
                  "### ✨ Principais Recursos",
                  "- 🛡️ **CrashDoctor™ Auto-Heal**: Detecção automática de falhas e sugestão de reparo.",
                  "- 🛡️ **Mod Shield™**: Prevenção ativa de conflitos e validação de compatibilidade pré-jogo.",
                  "- 📦 **Catálogo Unificado**: 50.000+ mods e modpacks do Modrinth e CurseForge em 1 clique.",
                  "- 🌐 **Multiplayer P2P Mesh**: Conexão privada direta entre amigos sem abrir portas no roteador.",
                  "- 🎨 **Estúdio 3D de Skins & Capas**: Prévia em tempo real e suporte a capas HD sem distorção.",
                  "- ☕ **Java Auto-Manager**: Download e gestão automática de runtimes Temurin (Java 8, 17, 21).",
                  "- 🐧 **Integração Linux Nativa**: Suporte a Wayland e X11, GameMode e ícone oficial na barra de tarefas.",
                  "- 🔒 **Zero Telemetria**: Todos os dados e credenciais ficam 100% locais na sua máquina.",
                  "",
                  "### 📥 Instaladores",
                  "| Plataforma | Arquivo | Formato |",
                  "| --- | --- | --- |",
                  "| 🪟 Windows | `Luxmc_2.0.0_x64-setup.exe` | Instalador NSIS |",
                  "| 🐧 Linux (Arch Linux) | `yay -S luxmc-launcher` / `pacman -U` | AUR / Pacman |",
                  "| 🐧 Universal Linux | `Luxmc_2.0.0_amd64.AppImage` | AppImage |",
                  "| 🐧 Ubuntu / Debian | `Luxmc_2.0.0_amd64.deb` | Pacote DEB |",
                  "| 🐧 Fedora / openSUSE | `Luxmc-2.0.0-1.x86_64.rpm` | Pacote RPM |",
                  "| 🍎 macOS (Universal) | `Luxmc_2.0.0_universal.dmg` | DMG |",
                  "",
                  "### Como instalar",
                  "- **Arch Linux**: `yay -S luxmc-launcher` ou `sudo pacman -U <url>.pkg.tar.zst`",
                  "- **Linux Universal**: `curl -fsSL https://luxmc-r92.pages.dev/install.sh | bash`",
                  "- **Windows**: Baixe o `Luxmc_2.0.0_x64-setup.exe` e execute o instalador",
                  "- **Ubuntu/Debian**: `sudo dpkg -i Luxmc_2.0.0_amd64.deb`",
                  "- **Fedora/RHEL**: `sudo rpm -i Luxmc-2.0.0-1.x86_64.rpm`",
                  "- **macOS**: Abra o `.dmg` e arraste para a pasta `/Applications`",
                ].join("\n"),
                draft: false,
                prerelease: tag.includes("beta") || tag.includes("alpha") || tag.includes("rc"),
              });
              releaseId = data.id;
              console.log(`Created new release for tag ${tag} (ID: ${releaseId})`);
            }
            return releaseId;

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Linux — DEB + RPM + AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage

      - name: Build and Upload Arch Linux Package (.pkg.tar.zst)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          sudo apt-get install -y zstd tar
          bash scripts/build-arch-package.sh
          if [ -f "packaging/arch/luxmc-2.0.0-1-x86_64.pkg.tar.zst" ]; then
            gh release upload "$RELEASE_TAG" "packaging/arch/luxmc-2.0.0-1-x86_64.pkg.tar.zst" --clobber
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Windows — NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc --bundles nsis

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (macOS — DMG universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target universal-apple-darwin --bundles dmg
