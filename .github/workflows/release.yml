name: Release Luxmc

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.5.4-beta)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Install System Dependencies (Validation)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend Lint (svelte-check)
        run: pnpm check

      - name: Rust Compilation Check
        working-directory: src-tauri
        run: cargo check

      - name: Rust Tests
        working-directory: src-tauri
        run: cargo test

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-22.04
    continue-on-error: true
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          set +e
          COMMITS=$(git log -n 30 --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Release update")
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "### 🚀 Luxmc Release"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.target }})
    needs: [validate]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install pnpm Dependencies
        run: pnpm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "rust-${{ matrix.target }}"

      - name: Install System Dependencies (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            rpm

      - name: Sync App Version with Tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ -n "$VERSION" && "$TAG" =~ ^v[0-9] ]]; then
            echo "Syncing app version to $VERSION from tag $TAG"
            if [ -f package.json ]; then
              node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
            fi
            if [ -f src-tauri/tauri.conf.json ]; then
              node -e "const fs = require('fs'); const t = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); t.version = '$VERSION'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(t, null, 2) + '\n');"
            fi
            if [ -f src-tauri/Cargo.toml ]; then
              sed -i.bak -E "s/^(version[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"$VERSION\"/" src-tauri/Cargo.toml || true
              rm -f src-tauri/Cargo.toml.bak
            fi
          fi

      - name: Cache NSIS (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\tauri\NSIS
            C:\Users\runneradmin\AppData\Roaming\tauri\NSIS
            ~\AppData\Local\tauri
            ~\AppData\Roaming\tauri
          key: nsis-3.11-windows-${{ runner.arch }}

      - name: Pre-download NSIS (Windows, with retry)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $nsisDir = "$env:APPDATA\tauri\NSIS"
          if (!(Test-Path "$nsisDir\nsis-3.11\NSIS.exe")) {
            New-Item -ItemType Directory -Force -Path $nsisDir | Out-Null
            $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
            $zip = "$nsisDir\nsis-3.11.zip"
            $maxRetries = 5
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                Write-Host "Downloading NSIS (attempt $i/$maxRetries)..."
                $ProgressPreference = 'SilentlyContinue'
                Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 120
                Write-Host "Download succeeded."
                break
              } catch {
                if ($i -eq $maxRetries) { throw }
                $wait = [math]::Pow(2, $i) * 5
                Write-Host "Failed (attempt $i): $_. Retrying in ${wait}s..."
                Start-Sleep -Seconds $wait
              }
            }
            Expand-Archive -Path $zip -DestinationPath $nsisDir -Force
            Remove-Item $zip -Force
          } else {
            Write-Host "NSIS already cached, skipping download."
          }

      - name: Build Tauri Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Luxmc ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install Luxmc."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Collect Build Artifacts
        id: artifacts
        shell: bash
        run: |
          mkdir -p upload
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage upload/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb upload/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm upload/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage upload/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/deb/*.deb upload/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/rpm/*.rpm upload/ 2>/dev/null || true
          fi
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe upload/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi upload/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/nsis/*.exe upload/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/msi/*.msi upload/ 2>/dev/null || true
          fi
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg upload/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/dmg/*.dmg upload/ 2>/dev/null || true
          fi
          echo "artifacts=upload" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}-${{ matrix.target }}
          path: upload/
          retention-days: 7

  upload-release:
    name: Upload to Release
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List Downloaded Artifacts
        run: find artifacts/ -type f | head -50

      - name: Upload Assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ## Luxmc ${{ inputs.tag_name || github.ref_name }}

          ### Download

          | Platform | Installer | Status |
          |----------|-----------|--------|
          | **Windows** | `.exe` (NSIS) | ✅ Available |
          | **Linux** | AppImage / `.deb` / `.rpm` | ✅ Available |
          | **macOS (Apple Silicon)** | `.dmg` | ✅ Available |
          | **macOS (Intel)** | `.dmg` | ✅ Available |

          ### System Requirements

          - **Windows**: Windows 10 or later (x64)
          - **Linux**: Ubuntu 22.04+ or equivalent (x64)
          - **macOS**: macOS 10.13 (High Sierra) or later

          ### Installation

          **Windows**
          1. Download the `.exe` installer and run it
          2. Follow the on-screen wizard
          3. Launch Luxmc from the Start Menu

          **Linux**
          - AppImage: `chmod +x Luxmc-*.AppImage && ./Luxmc-*.AppImage`
          - Debian/Ubuntu: `sudo dpkg -i Luxmc-*.deb`
          - Fedora/RHEL: `sudo rpm -i Luxmc-*.rpm`

          **macOS**
          1. Download the `.dmg` file
          2. Drag Luxmc to your Applications folder
          3. Right-click → Open (first launch only, to bypass Gatekeeper)

          ### Changelog

          ${{ needs.generate-changelog.outputs.changelog }}
          EOF

          gh release edit "$TAG_NAME" --title "Luxmc $TAG_NAME" --notes-file /tmp/release_notes.md --draft=false || gh release create "$TAG_NAME" --title "Luxmc $TAG_NAME" --notes-file /tmp/release_notes.md || true
          for f in artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            fi
          done

  build-jar:
    name: Build Universal Luxmc.jar
    needs: upload-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile Bootstrap JAR
        run: |
          mkdir -p out
          javac -source 11 -target 11 -d out bootstrap-jar/src/com/luxmc/bootstrap/Main.java
          cp src-tauri/icons/icon.png out/icon.png
          echo "Manifest-Version: 1.0" > manifest.txt
          echo "Main-Class: com.luxmc.bootstrap.Main" >> manifest.txt
          jar cfm Luxmc.jar manifest.txt -C out .

      - name: Upload JAR to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" Luxmc.jar --clobber
