name: CI

on:
  push:
    branches:
      - main
      - codex/launcher-refinement-builds
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable
  LUXMC_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  validate:
    name: Validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install System Dependencies (Validation)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust Compilation Check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Rust Tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Prepare verified real mod archives
        shell: bash
        run: node scripts/prepare-real-mod-fixtures.mjs "$RUNNER_TEMP/luxmc-real-mods"

      - name: Validate actual Terrorcraft metadata and read-only Shield scans
        working-directory: src-tauri
        shell: bash
        run: |
          LUXMC_REAL_MODS_DIR="$RUNNER_TEMP/luxmc-real-mods" cargo test --lib real_terrorcraft_archives_report_their_declared_versions --locked -- --ignored
          LUXMC_SHIELD_SCAN_DIR="$RUNNER_TEMP/luxmc-real-mods/mods" cargo test --lib installed_modpack_scan_is_read_only_and_reuses_content_cache --locked -- --ignored --nocapture

      - name: Frontend Lint (svelte-check)
        run: pnpm check

      - name: Frontend tests
        run: pnpm test:run

      - name: Install browser for content regression tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Content and scrolling regression tests
        run: pnpm test:browser:content

      - name: Website tests
        run: pnpm test:website

      - name: Release manifest tests
        run: node --test tests/release-manifest.test.mjs tests/release-signature.test.mjs tests/braces-depth.test.mjs

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

      - name: Frontend Build
        run: pnpm build

      - name: Tauri native compilation
        run: pnpm tauri build --no-bundle

      - name: Preserve Windows validation executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: luxmc-validation-windows-${{ github.sha }}
          path: src-tauri/target/release/luxmc.exe
          retention-days: 3
          if-no-files-found: error

      - name: Windows instance deletion regression
        if: runner.os == 'Windows'
        env:
          LUXMC_NATIVE_BINARY: src-tauri/target/release/luxmc.exe
        run: node scripts/verify-instance-deletion.mjs --fixtures-only

      - name: Prepare Windows WebView2 runtime for native UI verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ensure-ci-webview2.ps1

      - name: Windows native storage and build identity regression
        if: runner.os == 'Windows'
        env:
          LUXMC_NATIVE_BINARY: src-tauri/target/release/luxmc.exe
        run: node scripts/verify-storage-native.mjs

      - name: Prepare Java versions for loader integration tests
        if: runner.os == 'Linux'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: Prevent graphics calls before Minecraft initialization
        if: runner.os == 'Linux'
        run: node scripts/test-client-glfw.mjs

      - name: Verify LAN transformations after startup optimization
        if: runner.os == 'Linux'
        run: node scripts/test-client-hooks.mjs

      - name: Reuse prepared Java in isolated loader fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tempfile
          from pathlib import Path
          fixtures = ['luxmc_forge_1_20_1_cache', 'luxmc_forge_legacy_cache', 'luxmc_neoforge_1_20_4_cache', 'luxmc_neoforge_1_21_1_cache']
          for fixture in fixtures:
              root = Path(tempfile.gettempdir()) / fixture / 'installer-java'
              root.mkdir(parents=True, exist_ok=True)
              for major in [8, 17, 21]:
                  home = Path(os.environ[f'JAVA_HOME_{major}_X64'])
                  assert (home / 'bin/java').is_file()
                  destination = root / str(major)
                  if not destination.exists():
                      destination.symlink_to(home, target_is_directory=True)
          PY

      - name: Rust integration tests
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test --tests --locked

      - name: Rust dependency audit
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit || true
