name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable

jobs:
  validate:
    name: Validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install System Dependencies (Validation)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend Lint (svelte-check)
        run: pnpm check

      - name: Frontend tests
        run: pnpm test:run

      - name: Install browser for content regression tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Content and scrolling regression tests
        run: pnpm test:browser:content

      - name: Website tests
        run: pnpm test:website

      - name: Release manifest tests
        run: node --test tests/release-manifest.test.mjs

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

      - name: Frontend Build
        run: pnpm build

      - name: Prepare Windows verifier
        if: runner.os == 'Windows'
        run: node scripts/build-repair-helper.mjs --prepare

      - name: Recovery verifier tests
        run: cargo test --manifest-path src-tauri/repair-helper/Cargo.toml --locked

      - name: Rust Compilation Check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Tauri native compilation
        run: pnpm tauri build --no-bundle

      - name: Rust Tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Prepare Java versions for loader integration tests
        if: runner.os == 'Linux'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: Reuse prepared Java in isolated loader fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tempfile
          from pathlib import Path
          fixtures = ['luxmc_forge_1_20_1_cache', 'luxmc_forge_legacy_cache', 'luxmc_neoforge_1_20_4_cache', 'luxmc_neoforge_1_21_1_cache']
          for fixture in fixtures:
              root = Path(tempfile.gettempdir()) / fixture / 'installer-java'
              root.mkdir(parents=True, exist_ok=True)
              for major in [8, 17, 21]:
                  home = Path(os.environ[f'JAVA_HOME_{major}_X64'])
                  assert (home / 'bin/java').is_file()
                  destination = root / str(major)
                  if not destination.exists():
                      destination.symlink_to(home, target_is_directory=True)
          PY

      - name: Rust integration tests
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test --tests --locked

      - name: Rust dependency audit
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit || true
